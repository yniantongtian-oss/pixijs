name: Checkout and manifest integrity
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: repository-integrity-${{ github.ref }}
  cancel-in-progress: true
jobs:
  integrity:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Check tracked paths and package manifests
        run: python .github/quality/check_repository.py
  project-check:
    # Match the upstream Electron unit-test runner image.
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          # Match upstream's Electron installer compatibility baseline.
          node-version: "24.15.0"
      - name: Install locked dependencies
        timeout-minutes: 10
        shell: bash
        run: npm ci --registry=https://registry.npmjs.org
      - name: Run Electron unit tests
        timeout-minutes: 20
        shell: bash
        env:
          NODE_ENV: production
          # Isolated CI runner flags documented by jest-electron.
          JEST_ELECTRON_STARTUP_ARGS: --disable-dev-shm-usage --no-sandbox --enable-logging=stderr
        run: xvfb-run --auto-servernum npm run test -- unit --maxWorkers=50% --ci
      - name: Build distributable library
        shell: bash
        run: npm run build:lib
